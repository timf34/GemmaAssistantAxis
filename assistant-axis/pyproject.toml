[project]
name = "assistant-axis"
version = "0.1.0"
description = "Tools for computing and steering with the assistant axis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    # LOCAL: gemma4 model_type needs >=5.5.0; vllm>=0.19.1 requires >=5.5.3.
    # UPPER CAP: transformers 5.15.0 rewrote Gemma4Config to synthesize a `per_layer_config` that
    # overrides head_dim with global_head_dim, marking the config HETEROGENEOUS. Any plain read of
    # config.head_dim then raises AmbiguousGlobalPerLayerAttributeError — and vLLM 0.27.1
    # (get_head_size, model_arch_config_convertor.py:608) does exactly that, so the engine dies
    # before loading any weights. In 5.14.1 head_dim=256 / global_head_dim=512 are flat attributes,
    # which is the layout vLLM's gemma4 code reads. vllm 0.27.1 is the LATEST release and declares
    # only transformers>=5.5.3 with no cap, so the resolver picks 5.15.0 and breaks itself.
    # Upstream: https://github.com/vllm-project/vllm/issues/51744 (fix PRs not in any release yet).
    # Revisit when a vllm release ships the per_layer_config-aware head_dim lookup.
    "transformers>=5.5.3,<5.15",
    "accelerate",
    "huggingface_hub",
    "hf_transfer",   # LOCAL: RunPod images set HF_HUB_ENABLE_HF_TRANSFER=1; without this every HF download fails
    "hf_xet",        # LOCAL: same, for HF_HUB_ENABLE_XET
    "vllm>=0.19.1",          # LOCAL: day-0 Gemma 4 support; earlier releases pin transformers<5
    "scikit-learn",
    "numpy",
    "plotly",
    "jupyter",
    "pyarrow",
    # LOCAL: vllm 0.27.1 declares only openai>=2.0.0, but vllm/tool_parsers/utils.py imports
    # NamespaceTool from openai.types.responses, which first appears in openai 2.25.0 (2.24.0 has
    # no such symbol). With the lock's 2.15.0 `from vllm import LLM` died on ImportError while
    # `import vllm` alone still worked, so the version floor is vLLM's bug, not ours. Capped below
    # 3.0 so the resolver cannot drag the judge client across a major version on its own.
    "openai>=2.25.0,<3",
    "python-dotenv",
    "tqdm",
    "jsonlines",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant_axis"]
